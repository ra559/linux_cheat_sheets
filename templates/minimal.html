
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>$if(title)$$title$$else$Cheat Sheet$endif$</title>

  <!-- Local stylesheets -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/highlight.css">

  <!-- Google Fonts: JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
    rel="stylesheet"
  >
</head>

<body>
  <div class="page-layout">

    <!-- Navigation sidebar -->
    <aside class="toc-sidebar" aria-label="Table of contents">

      <!-- Search bar -->
      <div class="toc-search">
        <label for="toc-search-input">Search this page</label>
        <input
          id="toc-search-input"
          type="search"
          placeholder="Search headings..."
          autocomplete="off"
        >
      </div>

      <!-- Sidebar heading -->
      <div class="toc-sidebar__heading">
        <span class="toc-sidebar__short">TOC</span>
        <span class="toc-sidebar__full">On this page</span>
      </div>

      <!-- Pandoc-generated table of contents -->
      $if(toc)$
        $toc$
      $endif$

    </aside>

    <!-- Main document content -->
    <main class="document-content">
      $body$
    </main>

  </div>

  <!-- Back to top button -->
  <button
    id="back-to-top"
    class="back-to-top"
    type="button"
    aria-label="Back to top"
    title="Back to top"
  >
    <span aria-hidden="true">↑</span>
    <span class="back-to-top__label">Top</span>
  </button>

  <!-- Local JavaScript -->
  <script src="../js/nav-search.js" defer></script>
  <script src="../js/copy-code.js" defer></script>
  <script src="../js/back-to-top.js" defer></script>
</body>
</html>
